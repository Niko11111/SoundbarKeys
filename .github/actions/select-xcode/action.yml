name: Select Xcode 27
description: Makes sure Xcode 27 is selected (the app needs the macOS 27 SDK). Use with runs-on xcode-27.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        ls -d /Applications/Xcode*.app
        XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
        if ! xcodebuild -version | grep -q "^Xcode 27"; then
          echo "::error::Xcode 27 is not available on this runner (use runs-on: xcode-27)"
          exit 1
        fi
        xcodebuild -version
        swift --version
